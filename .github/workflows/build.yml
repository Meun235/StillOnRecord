name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build
        run: |
          if [ -f build.py ]; then python3 build.py; fi
          mkdir -p dist
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "build.py wrote dist directly"
          elif [ -d site ]; then
            echo "copying site/ into dist/"
            cp -r site/. dist/
          fi
          echo "--- contents of dist ---"
          ls -la dist
          echo "--- record pages generated ---"
          ls dist/record 2>/dev/null | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
